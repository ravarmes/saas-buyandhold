# ================================
# Docker Compose - SaaS Buy & Hold
# Orquestração completa da aplicação
# ================================

version: '3.8'

services:
  # ================================
  # Banco de Dados PostgreSQL
  # ================================
  database:
    image: postgres:15-alpine
    container_name: buyandhold-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-saas_buyandhold}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./saas-buyandhold-backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - buyandhold-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-saas_buyandhold}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ================================
  # Backend API Node.js
  # ================================
  backend:
    build:
      context: ./saas-buyandhold-backend
      dockerfile: Dockerfile
    container_name: buyandhold-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      
      # Database
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-saas_buyandhold}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      
      # Session
      SESSION_SECRET: ${SESSION_SECRET:-your_super_secret_session_key}
      
      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      
      # Payments (opcional)
      PIX_KEY: ${PIX_KEY:-}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY:-}
      
      # Email (opcional)
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_logs:/app/logs
    networks:
      - buyandhold-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ================================
  # Frontend React + Nginx
  # ================================
  frontend:
    build:
      context: ./saas-buyandhold-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
        REACT_APP_DOMAIN: ${REACT_APP_DOMAIN:-localhost}
    container_name: buyandhold-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - buyandhold-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ================================
# Volumes Persistentes
# ================================
volumes:
  postgres_data:
    driver: local
    name: buyandhold_postgres_data
  backend_logs:
    driver: local
    name: buyandhold_backend_logs

# ================================
# Rede Isolada
# ================================
networks:
  buyandhold-network:
    driver: bridge
    name: buyandhold-network